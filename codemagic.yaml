workflows:
  carmind-android-debug:
    name: CarMind v12 Owner-Control Sync - Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.9"
    scripts:
      - name: Restore and preflight
        script: |
          set -euo pipefail
          rm -rf app
          unzip -q carmind-app-source.zip
          test -f app/src/main/java/online/carmindai/app/CommerceClient.kt
          test -f app/src/main/java/online/carmindai/app/LocalTrainingBrain.kt
          grep -q 'versionCode = 12' app/build.gradle.kts
          grep -q 'state.trainingBox' app/src/main/java/online/carmindai/app/MainActivity.kt
          grep -q 'appSettings' app/src/main/java/online/carmindai/app/CommerceClient.kt
      - name: Configure SDK
        script: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT:-}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
      - name: Install Gradle
        script: |
          set -euo pipefail
          curl -L --retry 5 --retry-delay 2 --fail -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          echo "GRADLE_BIN=/tmp/gradle-${GRADLE_VERSION}/bin/gradle" >> "$CM_ENV"
      - name: Test and build
        script: |
          set -euo pipefail
          "$GRADLE_BIN" help --stacktrace --no-daemon
          "$GRADLE_BIN" :app:testDebugUnitTest --stacktrace --no-daemon
          "$GRADLE_BIN" :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        script: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          shasum -a 256 "$APK" | tee "$APK.sha256"
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/debug/app-debug.apk.sha256
