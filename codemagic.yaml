workflows:
  android-debug-apk:
    name: Carmind AI - Installable Debug APK
    max_build_duration: 60
    environment:
      java: 17
      node: lts
      vars:
        PACKAGE_NAME: "ai.carmind.car"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/carmind_build/node_modules
    scripts:
      - name: Open Carmind project
        script: |
          test -s Carmind-project.zip
          test -n "$CM_BUILD_DIR"
          rm -rf "$CM_BUILD_DIR/carmind_build"
          mkdir -p "$CM_BUILD_DIR/carmind_build"
          unzip -q Carmind-project.zip -d "$CM_BUILD_DIR/carmind_build"
          test -s "$CM_BUILD_DIR/carmind_build/package.json"
          test -s "$CM_BUILD_DIR/carmind_build/package-lock.json"
          test -d "$CM_BUILD_DIR/carmind_build/android/app"
          test -d "$CM_BUILD_DIR/carmind_build/android/phone"
      - name: Install web dependencies
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          npm ci
      - name: Build the Carmind interface
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          npm run build
      - name: Add reliable offline wake recognition
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          chmod +x scripts/prepare-vosk.sh
          scripts/prepare-vosk.sh
      - name: Add verified offline Whisper model
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          chmod +x scripts/prepare-whisper.sh
          scripts/prepare-whisper.sh
      - name: Bundle the interface inside Android
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          mkdir -p android/app/src/main/assets/www
          cp dist/index.html android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/index.html
      - name: Set Android SDK location
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build installable debug APK
        script: |
          cd "$CM_BUILD_DIR/carmind_build/android"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace
    artifacts:
      - carmind_build/android/app/build/outputs/apk/debug/*.apk
      - carmind_build/android/phone/build/outputs/apk/debug/*.apk
      - carmind_build/android/app/build/reports/**
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

  android-release-aab:
    name: Carmind AI - Unsigned Release Bundle
    max_build_duration: 60
    environment:
      java: 17
      node: lts
      vars:
        PACKAGE_NAME: "ai.carmind.car"
    scripts:
      - name: Open Carmind project
        script: |
          test -s Carmind-project.zip
          test -n "$CM_BUILD_DIR"
          rm -rf "$CM_BUILD_DIR/carmind_build"
          mkdir -p "$CM_BUILD_DIR/carmind_build"
          unzip -q Carmind-project.zip -d "$CM_BUILD_DIR/carmind_build"
          test -s "$CM_BUILD_DIR/carmind_build/package.json"
          test -s "$CM_BUILD_DIR/carmind_build/package-lock.json"
          test -d "$CM_BUILD_DIR/carmind_build/android/app"
          test -d "$CM_BUILD_DIR/carmind_build/android/phone"
      - name: Build and bundle Carmind
        script: |
          cd "$CM_BUILD_DIR/carmind_build"
          npm ci
          npm run build
          chmod +x scripts/prepare-vosk.sh
          scripts/prepare-vosk.sh
          chmod +x scripts/prepare-whisper.sh
          scripts/prepare-whisper.sh
          mkdir -p android/app/src/main/assets/www
          cp dist/index.html android/app/src/main/assets/www/index.html
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER -PversionName=1.0.$BUILD_NUMBER --stacktrace
    artifacts:
      - carmind_build/android/app/build/outputs/bundle/release/*.aab
      - carmind_build/android/phone/build/outputs/bundle/release/*.aab
