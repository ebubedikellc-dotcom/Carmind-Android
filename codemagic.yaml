workflows:
  carmind-android-debug:
    name: CarMind AI Native - Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "online.carmindai.app"
        GRADLE_VERSION: "8.9"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Restore Android app folder
        script: |
          set -e
          if [ ! -d app ]; then
            test -f carmind-app-source.zip
            unzip -q carmind-app-source.zip
          fi
          test -d app
          echo "CarMind app source restored"

      - name: Verify project files
        script: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/online/carmindai/app/MainActivity.kt
          echo "CarMind source tree OK"

      - name: Install Gradle 8.9
        script: |
          set -e
          curl -L --retry 3 --fail -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          rm -rf /tmp/gradle-${GRADLE_VERSION}
          unzip -q /tmp/gradle.zip -d /tmp
          echo "GRADLE_BIN=/tmp/gradle-${GRADLE_VERSION}/bin/gradle" >> "$CM_ENV"
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Prepare Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Run unit tests
        script: |
          set -e
          "$GRADLE_BIN" testDebugUnitTest --stacktrace --no-daemon

      - name: Build CarMind APK
        script: |
          set -e
          "$GRADLE_BIN" assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        script: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/debug/app-debug.apk.sha256
      - app/build/reports/**
