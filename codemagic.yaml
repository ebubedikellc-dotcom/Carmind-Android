workflows:
  android-debug-apk:
    name: Carmind AI - Installable Debug APK
    max_build_duration: 60
    environment:
      java: 17
      node: lts
      vars:
        PACKAGE_NAME: "ai.carmind.car"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Verify complete Carmind repository
        script: |
          test -n "$CM_BUILD_DIR"
          test -s "$CM_BUILD_DIR/package.json"
          test -s "$CM_BUILD_DIR/package-lock.json"
          test -d "$CM_BUILD_DIR/android/app"
          test -d "$CM_BUILD_DIR/android/phone"
      - name: Install web dependencies
        script: |
          cd "$CM_BUILD_DIR"
          npm ci
      - name: Build the Carmind interface
        script: |
          cd "$CM_BUILD_DIR"
          npm run build
      - name: Add reliable offline wake recognition
        script: |
          cd "$CM_BUILD_DIR"
          chmod +x scripts/prepare-vosk.sh
          scripts/prepare-vosk.sh
      - name: Bundle the interface inside Android
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p android/app/src/main/assets/www
          cp dist/index.html android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/index.html
      - name: Set Android SDK location
        script: |
          cd "$CM_BUILD_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build installable debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/phone/build/outputs/apk/debug/*.apk
      - android/app/build/reports/**
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

  android-release-aab:
    name: Carmind AI - Unsigned Release Bundle
    max_build_duration: 60
    environment:
      java: 17
      node: lts
      vars:
        PACKAGE_NAME: "ai.carmind.car"
    scripts:
      - name: Verify complete Carmind repository
        script: |
          test -n "$CM_BUILD_DIR"
          test -s "$CM_BUILD_DIR/package.json"
          test -s "$CM_BUILD_DIR/package-lock.json"
          test -d "$CM_BUILD_DIR/android/app"
          test -d "$CM_BUILD_DIR/android/phone"
      - name: Build and bundle Carmind
        script: |
          cd "$CM_BUILD_DIR"
          npm ci
          npm run build
          chmod +x scripts/prepare-vosk.sh
          scripts/prepare-vosk.sh
          mkdir -p android/app/src/main/assets/www
          cp dist/index.html android/app/src/main/assets/www/index.html
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER -PversionName=1.0.$BUILD_NUMBER --stacktrace
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/phone/build/outputs/bundle/release/*.aab
